*{box-sizing:border-box}
body{margin:0;background:#f2f3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#111}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0 0 12px}
.panel{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
input,textarea{width:100%;border:1px solid #cfd3d8;border-radius:8px;padding:10px;font-size:15px;background:#fff}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:9px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}
.secondary{background:#e9ecef;color:#111}
.danger{background:#f4dede;color:#8a1111}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.status{margin-top:8px;font-size:13px;color:#555}
.goods{overflow-x:auto}
.goods-head,.goods-row{display:grid;grid-template-columns:80px 100px minmax(170px,1fr) 100px 105px 80px 40px;gap:5px;min-width:735px}
.goods-head{font-size:10px;color:#666;font-weight:700;margin-bottom:5px}
.goods-row{margin-bottom:6px}
.goods-row input{padding:9px;font-size:13px}

<div id="oSuccessive" class="o" style="left:51.2%;top:25.7%;width:40%;height:3.0%;font-size:8px"></div>
<div id="oReservations" class="o" style="left:51.2%;top:31.0%;width:40%;height:4.8%;font-size:8px"></div>

<div id="oTrailer" class="o" style="left:62%;top:22.0%;width:28%;height:2.0%;font-size:8px;font-weight:700"></div>

<div id="printArea" style="display:none"></div>

<script>
(function(){
  "use strict";

  function byId(id){ return document.getElementById(id); }
  function val(id){ var e=byId(id); return e ? (e.value || "") : ""; }
  function setText(id, text){ var e=byId(id); if(e) e.textContent=text || ""; }
  function datePL(s){ if(!s) return ""; var a=s.split("-"); return a.length===3 ? a[2]+"."+a[1]+"."+a[0] : s; }

  function makeRow(data){
    var row=document.createElement("div");
    row.className="goods-row";
    row.innerHTML =
      '<input class="qty" inputmode="numeric" placeholder="np. 12">' +
      '<input class="pack" placeholder="palety">' +
      '<input class="desc" placeholder="Nazwa towaru">' +
      '<input class="stat" placeholder="nr">' +
      '<input class="weight" inputmode="decimal" placeholder="kg">' +
      '<input class="volume" inputmode="decimal" placeholder="m³">' +
      '<button type="button" class="danger remove">×</button>';

    if(data){
      row.querySelector(".qty").value=data.qty || "";
      row.querySelector(".pack").value=data.pack || "";
      row.querySelector(".desc").value=data.desc || "";
      row.querySelector(".stat").value=data.stat || "";
      row.querySelector(".weight").value=data.weight || "";
      row.querySelector(".volume").value=data.volume || "";
    }

    row.querySelector(".remove").onclick=function(){
      row.remove();
      update();
    };
    row.querySelectorAll("input").forEach(function(input){
      input.oninput=update;
    });
    byId("rows").appendChild(row);
    return row;
  }

  function update(){
    setText("oCmr",val("cmr"));
    setText("oSender",val("sender"));
    setText("oReceiver",val("receiver"));
    setText("oDelivery",val("delivery"));
    setText("oLoading",[val("loadingPlace"),datePL(val("loadingDate"))].filter(Boolean).join(" / "));
    setText("oDocs",val("docs"));
    setText("oMarks",val("marks"));
    setText("oCarrier",val("carrier"));
    setText("oSuccessive",val("successive"));
    setText("oReservations",val("reservations"));
    setText("oTractor","Ciągnik: "+val("tractor"));
    setText("oTrailer","Naczepa: "+val("trailer"));
    setText("oInstructions",val("instructions"));
    setText("oFreight",val("freight"));
    setText("oSpecial",val("special"));
    setText("oIssue",[val("loadingPlace"),datePL(val("loadingDate"))].filter(Boolean).join(" / "));
    var carrierName = val("carrier").trim();
    setText("o23",carrierName);
    setText("oExtra",val("extra"));

    var box=byId("cargoPreview");
    box.innerHTML="";
    var rows=document.querySelectorAll(".goods-row");
    rows.forEach(function(r,i){
      var y=39.5+i*3.35;
      var fields=[
        [9.0,7.0,r.querySelector(".qty").value],
        [16.8,5.4,r.querySelector(".pack").value],
        [22.4,5.2,r.querySelector(".desc").value],
        [28.1,17.0,r.querySelector(".stat").value],
        [53.5,11.3,r.querySelector(".weight").value],
        [65.2,11.3,r.querySelector(".volume").value]
      ];
      fields.forEach(function(f){
        var d=document.createElement("div");
        d.className="cargo";
        d.style.left=f[0]+"%";
        d.style.top=y+"%";
        d.style.width=f[1]+"%";
        d.style.height="3%";
        d.textContent=f[2] || "";
        box.appendChild(d);
      });
    });
    byId("status").textContent="Podgląd zaktualizowany.";
  }

  window.addCMRRow=function(){
    makeRow();
    update();
    byId("status").textContent="Dodano nowy wiersz towaru.";
  };

  window.updateCMR=update;

  window.printCMR=function(){
    update();
    var paper=byId("paper");
    var area=byId("printArea");
    area.innerHTML="";
    area.appendChild(paper.cloneNode(true));
    window.print();
  };

  window.clearCMR=function(){
    document.querySelectorAll("input,textarea").forEach(function(e){
      if(e.id==="carrier") e.value="TOMA-TRANS Tomasz Podgórski\nul. Tysiąclecia 6\n98-432 Dzietrzkowice";
      else if(e.id==="tractor") e.value="PNT65116";
      else if(e.id==="trailer") e.value="EWI3UG6";
      else e.value="";
    });
    byId("rows").innerHTML="";
    makeRow();
    update();
  };

  document.querySelectorAll("#app input,#app textarea").forEach(function(e){
    e.addEventListener("input",update);
    e.addEventListener("change",update);
  });

  makeRow();
  byId("jsWarning").style.display="none";
  update();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
